name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Le build (et donc le déploiement) ne se fait pas si les tests échouent :
      # cette étape est bloquante par défaut.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Poids du build
        run: |
          echo "### Poids de dist/" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          du -ah dist | sort -rh | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          TOTAL_KB=$(du -sk dist | cut -f1)
          echo "Total: ${TOTAL_KB} Ko (budget squelette : 2048 Ko ; budget jeu : 20 Mo)"
          if [ "$TOTAL_KB" -gt 2048 ]; then
            echo "::warning::dist/ pèse ${TOTAL_KB} Ko, au-dessus du budget de 2 Mo du squelette."
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
